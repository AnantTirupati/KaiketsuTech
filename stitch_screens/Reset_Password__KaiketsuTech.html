<style>
        body {
            background-color: #0B0B0B;
            background-image: 
                linear-gradient(to right, rgba(34, 34, 34, 0.3) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(34, 34, 34, 0.3) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
    </style>

<body class="min-h-screen flex items-center justify-center text-on-surface p-margin-mobile md:p-margin-desktop font-body-md">
<!-- Suppressed TopNavBar and Footer as this is a linear/transactional screen per Shared Components Logic -->
<main class="w-full max-w-md relative z-10">
<!-- Brand / Logo Area -->
<div class="text-center mb-10">
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tighter">KaiketsuTech</h1>
</div>
<!-- Card Container -->
<div class="bg-[#111111] border border-[#222222] rounded-lg p-8 shadow-2xl relative overflow-hidden">
<!-- Subtle Top Border Accent (Level 2 concept adapted for this card) -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<!-- Header -->
<div class="text-center mb-8">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Reset Your Password</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your email to receive a secure reset link.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 bg-[#0B0B0B] border border-[#222222] rounded text-on-surface font-body-md focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all duration-200 outline-none placeholder-on-surface-variant/50" id="email" name="email" placeholder="admin@kaiketsutech.com" required="" type="email"/>
</div>
</div>
<!-- Action Button -->
<div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-primary-container text-white font-label-md text-label-md uppercase tracking-wider hover:bg-primary-container/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#111111] focus:ring-primary-container transition-all duration-200" type="submit">
                        Send Reset Link
                    </button>
</div>
</form>
<!-- Footer / Back Link -->
<div class="mt-8 text-center">
<a class="inline-flex items-center font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-[16px] mr-1 group-hover:-translate-x-1 transition-transform duration-200">arrow_back</span>
                    Return to Login
                </a>
</div>
</div>
<!-- Technical Decoration -->
<div class="mt-12 text-center flex items-center justify-center space-x-4 opacity-40">
<span class="w-12 h-[1px] bg-[#333333]"></span>
<span class="font-mono-sm text-mono-sm text-on-surface-variant uppercase tracking-widest">Secure Auth Connection</span>
<span class="w-12 h-[1px] bg-[#333333]"></span>
</div>
</main>
<!-- Subtle interactive glow effect based on mouse movement for premium feel -->
<script>
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.bg-\\[\\#111111\\]');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // Very subtle radial gradient that follows the mouse
                card.style.backgroundImage = `
                    radial-gradient(
                        circle at ${x}px ${y}px, 
                        rgba(249, 115, 22, 0.03) 0%, 
                        transparent 40%
                    )
                `;
            });
        });
    </script>
</body></html>
